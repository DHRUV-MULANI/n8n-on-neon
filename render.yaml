services:
  - type: web
    name: n8n
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: /usr/local/bin/start.sh
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: N8N_HOST
        value: n8n.dhruvmulani.com
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_PORT
        value: "10000"
      - key: N8N_LISTEN_ADDRESS
        value: 0.0.0.0
      - key: WEBHOOK_URL
        value: https://n8n.dhruvmulani.com/
      - key: N8N_EDITOR_BASE_URL
        value: https://n8n.dhruvmulani.com/
      - key: N8N_PROXY_HOPS
        value: "1"
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_PERSONALIZATION_ENABLED
        value: "false"
      - key: N8N_DEFAULT_BINARY_DATA_MODE
        value: filesystem
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "168"
      - key: DB_POSTGRESDB_POOL_SIZE
        value: "5"
      - key: DATABASE_URL
        sync: false
